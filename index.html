<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fart Synth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#120d18;--panel:#231a2e;--edge:#3d2c4d;--cream:#f3e6c4;--lime:#b6ff3c;--pink:#ff5fa2;--dim:#8f7fa3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'Space Mono',monospace}
#app{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.logo{height:46px;width:46px;object-fit:contain;margin-right:-6px;filter:drop-shadow(2px 2px 0 var(--pink))}
h1{font-family:'Bowlby One',sans-serif;font-weight:400;font-size:44px;margin:0;color:var(--lime);letter-spacing:1px;text-shadow:3px 3px 0 var(--pink)}
.sub{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;flex:1;min-width:180px}
.skins{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.skins button{width:24px;height:24px;border-radius:50%;border:3px solid #1b0e0a;cursor:pointer;padding:0}
.skins button.on{outline:3px solid var(--lime)}
main{display:grid;grid-template-columns:260px minmax(0,1fr) 260px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:3px solid var(--edge);border-radius:18px;padding:12px 12px 14px}
.panel h2{margin:0 0 10px;font-family:'Bowlby One',sans-serif;font-weight:400;font-size:15px;color:var(--pink);letter-spacing:1px}
.knobs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 4px}
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none;touch-action:none;cursor:ns-resize}
.dial{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4d6,#d9c590 60%,#a8935a);border:3px solid #1b0e0a;position:relative;box-shadow:0 4px 0 #0c0710}
.dial i{position:absolute;left:50%;top:5px;width:4px;height:17px;margin-left:-2px;background:var(--pink);border-radius:2px;transform-origin:50% 22px}
.knob label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--cream);cursor:inherit}
.knob output{font-size:10px;color:var(--lime)}
#envg{width:100%;height:70px;background:#150e1d;border:2px solid var(--edge);border-radius:10px;display:block;margin-bottom:12px}
.center{display:flex;flex-direction:column;gap:12px;align-items:center}
.stage{position:relative;width:100%;max-width:580px}
#butt{width:100%;display:block;border-radius:22px;border:3px solid var(--edge);background:#1c1426;touch-action:none;cursor:pointer}
#hint{position:absolute;left:0;right:0;top:14px;text-align:center;font-family:'Bowlby One',sans-serif;color:var(--lime);font-size:18px;pointer-events:none;text-shadow:2px 2px 0 #000;transition:opacity .4s}
#scope{width:100%;max-width:580px;height:70px;background:#150e1d;border:3px solid var(--edge);border-radius:14px;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:580px}
.btn{font-family:'Space Mono',monospace;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;background:#2d2140;color:var(--cream);border:3px solid #1b0e0a;border-radius:12px;padding:8px 11px;cursor:pointer;box-shadow:0 3px 0 #0c0710}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0c0710}
.btn.on{background:var(--lime);color:#1b0e0a}
.btn.pink{background:var(--pink);color:#1b0e0a}
.keys{font-size:11px;color:var(--dim);text-align:center;max-width:580px;line-height:1.5}
.psiwrap{display:flex;gap:12px;align-items:center}
#psi{width:22px;height:96px;background:#150e1d;border:2px solid var(--edge);border-radius:8px;position:relative;overflow:hidden;flex:none}
#psi div{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#ff5fa2,#b6ff3c)}
.psiwrap .knobs{flex:1;grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){main{grid-template-columns:1fr}.center{order:-1}.col{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}}
</style>
</head>

<script>
/* ---------- parameters ---------- */
const DEFS=[
 ['env','pressure','Pressure',0,1,0.8,'lin','pct'],
 ['env','attack','Attack',3,800,15,'exp','ms'],
 ['env','decay','Decay',10,2500,300,'exp','ms'],
 ['env','sustain','Sustain',0,1,0.6,'lin','pct'],
 ['env','release','Release',10,3000,250,'exp','ms'],
 ['env','length','Length',0.1,5,1.2,'exp','s'],
 ['tone','pitch','Pitch',-24,24,0,'lin','st'],
 ['tone','tight','Tightness',0,1,0.4,'lin','pct'],
 ['tone','flutter','Flutter',0,1,0.3,'lin','pct'],
 ['tone','slide','Slide',-1,1,0.5,'lin','bi'],
 ['tone','cavity','Cavity',80,1500,275,'exp','hz'],
 ['tone','bright','Bright',500,10000,2400,'exp','hz'],
 ['tex','wet','Wetness',0,1,0.3,'lin','pct'],
 ['tex','sputter','Sputter',0,1,0.2,'lin','pct'],
 ['tex','rumble','Rumble',0,1,0.2,'lin','pct'],
 ['tex','gas','Gas',0,1,0.2,'lin','pct'],
 ['tex','body','Body',0,1,0.9,'lin','pct'],
 ['out','drive','Drive',0,1,0.2,'lin','pct'],
 ['out','volume','Volume',0,1,0.7,'lin','pct'],
];
const P={};DEFS.forEach(d=>P[d[1]]=d[5]);
const PRESETS={
 'Classic':{},
 'Squeaker':{pitch:14,tight:.95,flutter:.15,sputter:.1,wet:0,attack:5,decay:120,sustain:.3,release:80,length:.5,cavity:700,slide:.2,gas:.1,rumble:0},
 'Wet Squelch':{pitch:-3,tight:.3,wet:.9,sputter:.5,flutter:.6,cavity:250,slide:.7,length:1,rumble:.3,drive:.35},
 'Long Rumbler':{pitch:-14,tight:.2,flutter:.25,rumble:.8,sustain:.8,attack:120,decay:800,release:900,length:3.5,cavity:170,slide:.3,wet:.2,bright:1800},
 'Trumpet':{pitch:4,tight:.7,flutter:.05,sputter:0,wet:0,rumble:.05,sustain:.9,attack:30,cavity:500,bright:6000,drive:.5,slide:-.1,length:1.2},
 'Silent But Deadly':{body:.08,gas:.95,pressure:.6,attack:200,sustain:.7,release:600,length:3,bright:2500,cavity:900,wet:0,sputter:0},
 'Machine Gun':{sputter:.9,flutter:.5,tight:.7,pitch:4,length:1.4,wet:.2,decay:600,sustain:.7,rumble:.1},
};

/* ---------- DSP: physical-ish fart voice ---------- */
//DSP-BEGIN
const ASYM=0.9,MIXL=0.5;
function ss(a,b,x){x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x);}
class Voice{
 constructor(sr){this.sr=sr;this.reset();this.stage=0;this.env=0;this.note=0;this.gate=false;this.flap=0;this.wetGate=1;this.pulses=0;this.gateCount=0;this.rumPh=0;this.rumPh2=0;this.dbgX=0;}
 reset(){this.x=0;this.v=0;this.pt=0;this.wetN=0;this.pn=0;this.fn=0;this.dr=0;this.tn=0;this.gl=0;
  this.fl1=0;this.fb1=0;this.lp1=0;this.bp1=0;this.lp2=0;this.bp2=0;this.lp3=0;this.bp3=0;this.lpb=0;this.Up=0;this.dcU=0;}
 on(note,retrig){this.note=note;if(retrig||this.stage===0||this.stage===4){if(this.stage===0)this.reset();this.stage=1;this.gate=true;this.gateCount++;}}
 off(){if(this.stage!==0)this.stage=4;this.gate=false;}
 render(out,P){
  // Self-oscillating sphincter (lip-reed style mass-spring valve) driven by pressure,
  // coupled to a resonant tract and buffeted by turbulence noise.
  const sr=this.sr,n=out.length,dt=1/sr;
  const att=1/(Math.max(P.attack,1)*0.001*sr);
  const dec=(1-P.sustain)/(Math.max(P.decay,1)*0.001*sr);
  const relC=Math.exp(-4.6/(Math.max(P.release,5)*0.001*sr));
  const lpc=hz=>1-Math.exp(-6.2832*hz/sr);
  const wetA=lpc(12+P.wet*90),wetNorm=1/Math.sqrt(wetA/6);
  const pnA=lpc(28),pnNorm=1/Math.sqrt(pnA/6);
  const flA=lpc(14),flNorm=1/Math.sqrt(flA/6);
  const drA=lpc(3),drNorm=1/Math.sqrt(drA/6);
  const tnA=lpc(2500);
  const gasA=lpc(Math.min(P.bright*1.3,9000));
  const dGain=1+P.drive*7;
  const f0=26*Math.pow(2,(P.pitch+this.note)/12)*(1+P.tight*0.6)*(0.85+0.3*P.pressure);
  const x0=-0.12-P.tight*0.3;           // rest position (negative = held shut)
  const Q=1.3+P.tight*2.5;
  const maxFc=sr/6.5;
  const fcb=P.cavity;
  for(let i=0;i<n;i++){
   if(this.stage===0){out[i]=0;this.flap*=0.999;continue;}
   if(this.stage===1){this.env+=att;if(this.env>=1){this.env=1;this.stage=2;}}
   else if(this.stage===2){this.env-=dec;if(this.env<=P.sustain){this.env=P.sustain;this.stage=3;}}
   else if(this.stage===3){this.env+=(P.sustain-this.env)*0.002;}
   else if(this.stage===4){this.env*=relC;if(this.env<0.0008){this.env=0;this.stage=0;out[i]=0;continue;}}
   const e=this.env;
   const nz=Math.random()*2-1;
   this.rumPh2+=6.2832*0.37/sr;this.rumPh+=(4+5*(0.5+0.5*Math.sin(this.rumPh2)))/sr;if(this.rumPh>1)this.rumPh-=1;
   const rum=Math.sin(6.2832*this.rumPh);
   this.wetN+=(nz-this.wetN)*wetA;const wn=this.wetN*wetNorm;const wg=ss(-0.4,0.5,wn);this.wetGate=wg;
   this.pn+=((Math.random()*2-1)-this.pn)*pnA;const pnN=this.pn*pnNorm;
   this.fn+=((Math.random()*2-1)-this.fn)*flA;const flN=this.fn*flNorm;
   this.dr+=((Math.random()*2-1)-this.dr)*drA;const drN=this.dr*drNorm;
   // mouth pressure (what pushes the sphincter open)
   let pm=P.pressure*(0.2+0.8*e)*(1+0.12*pnN+P.sputter*0.9*pnN)*(1-P.rumble*0.45*(0.5+0.5*rum))*(1-P.wet*0.8*(1-wg));
   if(pm<0)pm=0;
   // valve stiffness -> pitch: slide, flutter, drift, rumble, burble
   let w=6.2832*f0*(1+P.slide*(e-0.5)*1.4)*(1+(0.04+P.flutter*0.3)*flN*0.5+0.05*drN)*(1+P.rumble*0.1*rum)*(1+P.wet*0.25*wn);

   const dp=pm-this.pt;
   // pressure force fades as the gap widens; stronger while opening than closing (the asymmetry that sustains flapping)
   const open1=1-this.x/0.9,pf=dp*(open1>0?open1:0);

   const U=dp>0?this.x*Math.sqrt(dp):0;       // airflow through the gap
   // tract feedback (pressure the tract pushes back at the valve)
   const ff=2*Math.sin(3.14159*Math.min(fcb,maxFc)/sr);

   this.pt=0.35*this.fb1;

   this.tn+=((Math.random()*2-1)-this.tn)*tnA;
   this.gl+=((Math.random()*2-1)-this.gl)*gasA;
   const ud=(U-this.Up)*sr*0.0004;this.Up=U;const uh=U-this.dcU;this.dcU+=uh*0.002;   // radiated sound ~ derivative of flow: sharp openings -> rich harmonics
   const src=((ud*0.5+uh*MIXL)*P.body)+this.tn*U*(0.9+1.4*P.wet)+this.gl*P.gas*(0.35+0.65*e)*2.2;
   // tract/room colour: closed-tube resonances 1:3:5
   let fc1=Math.min(P.cavity*(0.9+0.2*e),maxFc);const fc2=Math.min(fc1*3,maxFc),fc3=Math.min(fc1*5,maxFc);
   const f1=2*Math.sin(3.14159*fc1/sr),f2=2*Math.sin(3.14159*fc2/sr),f3=2*Math.sin(3.14159*fc3/sr);
   this.lp1+=f1*this.bp1;const h1=src-this.lp1-0.6*this.bp1;this.bp1+=f1*h1;
   this.lp2+=f2*this.bp2;const h2=src-this.lp2-0.5*this.bp2;this.bp2+=f2*h2;
   this.lp3+=f3*this.bp3;const h3=src-this.lp3-0.5*this.bp3;this.bp3+=f3*h3;
   let m=src*0.8+this.bp1*0.7+this.bp2*0.3+this.bp3*0.15;
   const brA=lpc(P.bright*(0.2+0.8*e));
   this.lpb+=brA*(m-this.lpb);
   m=Math.tanh(this.lpb*dGain)*0.8;
   const o=m*Math.pow(e,0.7)*P.volume*(0.4+0.6*P.pressure)*2.0;
   out[i]=o;this.dbgX=this.x;
   this.flap+=(Math.abs(o)-this.flap)*0.002;
  }
 }
}
//DSP-END

/* ---------- audio engine ---------- */
let actx=null,voice=null,analyser=null,aBuf=null,oneTimer=null;
function startAudio(){
 if(actx){if(actx.state!=='running')actx.resume();return;}
 const AC=window.AudioContext||window.webkitAudioContext;actx=new AC();
 voice=new Voice(actx.sampleRate);
 const proc=actx.createScriptProcessor(1024,1,1);
 proc.onaudioprocess=e=>voice.render(e.outputBuffer.getChannelData(0),P);
 analyser=actx.createAnalyser();analyser.fftSize=1024;aBuf=new Float32Array(analyser.fftSize);
 const comp=actx.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=8;
 const silent=actx.createGain();silent.gain.value=0;
 const src=actx.createConstantSource?actx.createConstantSource():null;
 if(src){src.connect(proc);src.start();}
 proc.connect(analyser);analyser.connect(comp);comp.connect(actx.destination);
 actx.resume();
}
let holdMode=true;
function noteOn(n,retrig=true){startAudio();voice.on(n,retrig);buttKick();document.getElementById('hint').style.opacity=0;}
function noteOff(){if(voice)voice.off();}
function buttPress(){
 noteOn(0,true);
 if(!holdMode){clearTimeout(oneTimer);oneTimer=setTimeout(noteOff,P.length*1000);}
}
function buttRelease(){if(holdMode)noteOff();}

/* ---------- knobs ---------- */
const knobEls={};
function toNorm(d,v){const[,,,mn,mx,,c]=d;return c==='exp'?Math.log(v/mn)/Math.log(mx/mn):(v-mn)/(mx-mn);}
function fromNorm(d,n){const[,,,mn,mx,,c]=d;n=Math.min(1,Math.max(0,n));return c==='exp'?mn*Math.pow(mx/mn,n):mn+n*(mx-mn);}
function fmt(d,v){switch(d[7]){case 'pct':return Math.round(v*100)+'%';case 'ms':return v>=1000?(v/1000).toFixed(2)+'s':Math.round(v)+'ms';case 's':return v.toFixed(2)+'s';case 'st':return (v>0?'+':'')+v.toFixed(1)+'st';case 'hz':return Math.round(v)+'Hz';case 'bi':return (v>0?'+':'')+Math.round(v*100)+'%';}return v;}
function setParam(id,v){
 const d=DEFS.find(x=>x[1]===id);v=Math.min(d[4],Math.max(d[3],v));P[id]=v;
 const k=knobEls[id];if(k){const n=toNorm(d,v);k.i.style.transform='rotate('+(-135+270*n)+'deg)';k.o.textContent=fmt(d,v);}
 drawEnv();
}
DEFS.forEach(d=>{
 const wrap=document.createElement('div');wrap.className='knob';
 wrap.innerHTML='<div class="dial"><i></i></div><label>'+d[2]+'</label><output></output>';
 document.getElementById('g-'+d[0]).appendChild(wrap);
 knobEls[d[1]]={i:wrap.querySelector('i'),o:wrap.querySelector('output')};
 let startY=0,startN=0;
 wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture(e.pointerId);startY=e.clientY;startN=toNorm(d,P[d[1]]);e.preventDefault();});
 wrap.addEventListener('pointermove',e=>{if(!wrap.hasPointerCapture(e.pointerId))return;const k=e.shiftKey?0.0008:0.006;setParam(d[1],fromNorm(d,startN+(startY-e.clientY)*k));});
 wrap.addEventListener('dblclick',()=>setParam(d[1],d[5]));
 wrap.addEventListener('wheel',e=>{e.preventDefault();setParam(d[1],fromNorm(d,toNorm(d,P[d[1]])+(e.deltaY<0?0.03:-0.03)));},{passive:false});
});

/* ---------- envelope graph ---------- */
const envg=document.getElementById('envg'),eg=envg.getContext('2d');
function drawEnv(){
 const W=envg.width,H=envg.height;eg.clearRect(0,0,W,H);
 const wA=24+110*Math.sqrt(P.attack/800),wD=24+130*Math.sqrt(P.decay/2500),wS=90,wR=24+130*Math.sqrt(P.release/3000);
 const tot=wA+wD+wS+wR,sc=(W-24)/tot,pad=12,y=l=>H-10-l*(H-26);
 let x0=pad;const pts=[[x0,y(0)]];
 x0+=wA*sc;pts.push([x0,y(1)]);x0+=wD*sc;pts.push([x0,y(P.sustain)]);x0+=wS*sc;pts.push([x0,y(P.sustain)]);x0+=wR*sc;pts.push([x0,y(0)]);
 eg.beginPath();pts.forEach((p,i)=>i?eg.lineTo(p[0],p[1]):eg.moveTo(p[0],p[1]));
 eg.lineTo(pts[4][0],H);eg.lineTo(pts[0][0],H);eg.closePath();eg.fillStyle='rgba(182,255,60,.18)';eg.fill();
 eg.beginPath();pts.forEach((p,i)=>i?eg.lineTo(p[0],p[1]):eg.moveTo(p[0],p[1]));
 eg.strokeStyle='#b6ff3c';eg.lineWidth=4;eg.lineJoin='round';eg.stroke();
}

/* ---------- presets / buttons ---------- */
function applyPreset(o){DEFS.forEach(d=>setParam(d[1],o[d[1]]!==undefined?o[d[1]]:d[5]));}
Object.keys(PRESETS).forEach(name=>{
 const b=document.createElement('button');b.className='btn';b.textContent=name;
 b.onclick=()=>{applyPreset(PRESETS[name]);};document.getElementById('presets').appendChild(b);
});
document.getElementById('mode').onclick=e=>{holdMode=!holdMode;e.target.textContent=holdMode?'Hold':'One-shot';e.target.classList.toggle('on',holdMode);};
document.getElementById('rand').onclick=()=>{
 DEFS.forEach(d=>{const id=d[1];if(id==='volume'||id==='pressure')return;let n=Math.random();if(id==='body')n=0.6+n*0.4;if(id==='length')n=0.3+n*0.5;setParam(id,fromNorm(d,n));});
};

/* ---------- computer keyboard ---------- */
const KEYMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15};
const held=[];
addEventListener('keydown',e=>{
 if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase();if(!(k in KEYMAP))return;
 const n=KEYMAP[k];const idx=held.indexOf(n);if(idx>=0)return;
 const was=held.length>0;held.push(n);
 noteOn(n,!was);
 if(!holdMode){clearTimeout(oneTimer);oneTimer=setTimeout(()=>{held.length=0;noteOff();},P.length*1000);}
});
addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();if(!(k in KEYMAP))return;const n=KEYMAP[k];const idx=held.indexOf(n);if(idx<0)return;held.splice(idx,1);
 if(!holdMode)return;
 if(held.length===0)noteOff();else voice.note=held[held.length-1];
});

/* ---------- skin tones ---------- */
const SKINS=[[245,208,176],[224,163,122],[198,134,66],[141,85,36],[92,58,33]];
let skin=SKINS[1];
const skinWrap=document.getElementById('skins');
SKINS.forEach((c,i)=>{const b=document.createElement('button');b.style.background='rgb('+c.join(',')+')';if(i===1)b.className='on';
 b.onclick=()=>{skin=c;[...skinWrap.querySelectorAll('button')].forEach(x=>x.classList.remove('on'));b.classList.add('on');if(typeof reSkin==='function')reSkin();};skinWrap.appendChild(b);});

/* ---------- butt visualizer (baked 3D-lit art + animated overlays) ---------- */
const bc=document.getElementById('butt'),ctx=bc.getContext('2d');
const LW=600,LH=640,dpr=Math.min(2,window.devicePixelRatio||1);
bc.width=LW*dpr;bc.height=LH*dpr;
const sc=document.getElementById('scope'),sctx=sc.getContext('2d');
function sizeScope(){sc.width=sc.clientWidth*dpr;sc.height=sc.clientHeight*dpr;}sizeScope();addEventListener('resize',sizeScope);
const CX=300,INK='#1b0e0a',sphY=394,ZOOM=1.45,ZANCH=395,ZPIV=372;
const BK=1.5,PADT=70,PADB=100,TW=Math.round(LW*BK),TH=Math.round((LH+PADT+PADB)*BK);
const sm=(a,b,x)=>{x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x);};
function mkc(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function rasterMask(fn){const c=mkc(TW,TH),x=c.getContext('2d',{willReadFrequently:true});x.scale(BK,BK);x.translate(0,PADT);x.fillStyle='#fff';fn(x);const d=x.getImageData(0,0,TW,TH).data,m=new Float32Array(TW*TH);for(let i=0;i<m.length;i++)m[i]=d[i*4+3]/255;return m;}
function boxH(src,dst,w,h,r){const inv=1/(2*r+1);for(let y=0;y<h;y++){const o=y*w;let acc=0;for(let x=-r;x<=r;x++)if(x>=0&&x<w)acc+=src[o+x];for(let x=0;x<w;x++){dst[o+x]=acc*inv;const ad=x+r+1,sb=x-r;if(ad<w)acc+=src[o+ad];if(sb>=0)acc-=src[o+sb];}}}
function boxV(src,dst,w,h,r){const inv=1/(2*r+1);for(let x=0;x<w;x++){let acc=0;for(let y=-r;y<=r;y++)if(y>=0&&y<h)acc+=src[y*w+x];for(let y=0;y<h;y++){dst[y*w+x]=acc*inv;const ad=y+r+1,sb=y-r;if(ad<h)acc+=src[ad*w+x];if(sb>=0)acc-=src[sb*w+x];}}}
function blur(src,r){r=Math.max(1,Math.round(r));let a=Float32Array.from(src),b=new Float32Array(src.length);for(let p=0;p<3;p++){boxH(a,b,TW,TH,r);boxV(b,a,TW,TH,r);}return a;}
function torsoPath(x){x.beginPath();x.moveTo(CX,-40);x.lineTo(CX+110,-40);
 x.bezierCurveTo(CX+110,60,CX+215,140,CX+210,270);x.bezierCurveTo(CX+205,380,CX+170,440,CX+110,445);x.bezierCurveTo(CX+60,448,CX+20,430,CX,415);
 x.bezierCurveTo(CX-20,430,CX-60,448,CX-110,445);x.bezierCurveTo(CX-170,440,CX-205,380,CX-210,270);x.bezierCurveTo(CX-215,140,CX-110,60,CX-110,-40);x.closePath();x.fill();}
function thighPath(x){[-1,1].forEach(q=>{x.beginPath();x.moveTo(CX+q*6,330);x.lineTo(CX+q*214,330);x.bezierCurveTo(CX+q*218,470,CX+q*202,600,CX+q*184,740);x.lineTo(CX+q*9,740);x.bezierCurveTo(CX+q*12,600,CX+q*4,470,CX+q*6,330);x.closePath();x.fill();});}
function shirtPath(x){x.beginPath();x.moveTo(CX-120,-40);x.lineTo(CX+120,-40);x.bezierCurveTo(CX+124,20,CX+152,60,CX+162,96);
 x.bezierCurveTo(CX+120,124,CX+70,86,CX+10,108);x.bezierCurveTo(CX-50,128,CX-100,92,CX-162,98);x.bezierCurveTo(CX-152,60,CX-124,20,CX-120,-40);x.closePath();x.fill();}
const LV=(()=>{const v=[-0.5,-0.62,0.6],l=Math.hypot(...v);return v.map(a=>a/l);})();
const HV=(()=>{const v=[LV[0],LV[1],LV[2]+1],l=Math.hypot(...v);return v.map(a=>a/l);})();
function hnoise(x,y){const v=Math.sin(x*12.9898+y*78.233)*43758.5453;return v-Math.floor(v)-0.5;}
// generic lit-surface renderer: heightfield -> normals -> diffuse/spec/rim/sss/AO/edge
function shadeTex(o){
 const w=TW,hh=TH,out=mkc(w,hh),ox=out.getContext('2d'),img=ox.createImageData(w,hh),d=img.data,H=o.h,M=o.mask;
 for(let y=1;y<hh-1;y++)for(let x=1;x<w-1;x++){
  const i=y*w+x,a=M[i];if(a<0.004)continue;
  let nx=-(H[i+1]-H[i-1])*o.S,ny=-(H[i+w]-H[i-w])*o.S;const il=1/Math.sqrt(nx*nx+ny*ny+1);nx*=il;ny*=il;const nz=il;
  const nl=nx*LV[0]+ny*LV[1]+nz*LV[2];

  const sp=(Math.pow(nh,o.shin)*o.spec+Math.pow(nh,o.shin*0.22)*o.spec*0.18);

  const edge=0.2+0.8*sm(0.6,0.985,o.tiny[i]);
  const k=(0.55+0.45*ao)*edge;
  r*=k;g*=k;b*=k;
  const p=i*4;d[p]=Math.min(255,r*255);d[p+1]=Math.min(255,g*255);d[p+2]=Math.min(255,b*255);d[p+3]=Math.min(255,a*255);
 }
 ox.putImageData(img,0,0);return out;
}
let GEO=null,torsoTex=null,thighTex=null,shirtTex=null,artReady=false;
function bakeGeometry(){
 const tm=rasterMask(torsoPath),thm=rasterMask(thighPath),shm=rasterMask(shirtPath);
 const n=tm.length;
 // torso heightfield: pillow inflate + two cheek domes + centre groove
 const big=blur(tm,58*BK),med=blur(tm,20*BK),tiny=blur(tm,2.4*BK),th=new Float32Array(n);
 for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){const i=y*TW+x;if(tm[i]<0.004)continue;const X=x/BK,Y=y/BK-PADT;
  const bl=Math.exp(-((X-(CX-105))**2/9025+(Y-255)**2/22500)),br=Math.exp(-((X-(CX+105))**2/9025+(Y-255)**2/22500));
  th[i]=0.6*big[i]+0.4*med[i]+0.24*(bl+br)-0.2*Math.exp(-((X-CX)**2)/(2*26*26))*sm(190,360,Y)-0.19*Math.exp(-((X-CX)**2)/(2*19*19))*sm(205,330,Y)*(1-sm(395,428,Y));}
 // thighs
 const tb=blur(thm,40*BK),tt=blur(thm,2.4*BK),tmed=blur(thm,14*BK),thh=new Float32Array(n);
 for(let i=0;i<n;i++)thh[i]=0.7*tb[i]+0.3*tmed[i];
 // shadow cast by cheeks onto thighs
 const cs=blur(tm,18*BK),cast=new Float32Array(n);
 for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){const sy=y-Math.round(26*BK);cast[y*TW+x]=sy>=0?cs[sy*TW+x]:0;}
 // shirt heightfield with cloth folds + raised print
 const tx=mkc(TW,TH),tc=tx.getContext('2d');tc.scale(BK,BK);tc.translate(0,PADT);tc.fillStyle='#fff';tc.textAlign='center';tc.textBaseline='middle';tc.font="72px 'Bowlby One',Impact,'Arial Black',sans-serif";
 const td=tc.getImageData(0,0,TW,TH).data,textM=new Float32Array(n);for(let i=0;i<n;i++)textM[i]=td[i*4+3]/255;
 const sb=blur(shm,16*BK),st=blur(shm,2.4*BK),stx=blur(textM,1.6*BK),sh=new Float32Array(n);
 for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){const i=y*TW+x;if(shm[i]<0.004)continue;const X=x/BK,Y=y/BK-PADT;
  const fold=0.045*Math.sin((X-CX)*0.05+Math.sin(Y*0.045+X*0.012)*2.4)*sm(-20,110,Y)+0.03*Math.sin(X*0.11+Y*0.07)*sm(55,108,Y);
  sh[i]=0.75*sb[i]+fold+0.05*stx[i];}
 GEO={tm,thm,shm,th,tt,thh,tt2:tt,tiny:tiny,tbTiny:tt,cast,st,sh,textM};
 GEO.tiny=tiny;GEO.thTiny=tt;GEO.shTiny=st;
}
function bakeSkin(){
 if(!GEO)return;const sk=skin.map(v=>v/255);
 const skinAlb=(x,y)=>{const X=x/BK,Y=y/BK-PADT,n=hnoise(x,y)*0.05+hnoise(x*0.31,y*0.31)*0.04;
  const bl=sm(290,440,Y)*Math.exp(-((X-CX)**2)/(2*95*95))*0.5;
  const hem=1-0.5*Math.exp(-((Y-104)**2)/(2*13*13))*sm(92,104,Y);
  const cr=1-0.5*Math.exp(-((X-CX)**2)/(2*9*9))*sm(210,300,Y)*(1-sm(398,428,Y))-0.25*Math.exp(-((X-CX)**2)/(2*26*26))*sm(200,320,Y)*(1-sm(398,428,Y));
  return [sk[0]*(1+n)*hem*cr,sk[1]*(1+n)*(1-0.24*bl)*hem*cr,sk[2]*(1+n)*(1-0.3*bl)*hem*cr];};
 torsoTex=shadeTex({h:GEO.th,mask:GEO.tm,tiny:GEO.tiny,S:230*BK/1.5,wrap:0.55,spec:0.34,shin:34,rim:0.3,sss:0.38,albedo:skinAlb});
 const thAlb=(x,y)=>{const a=skinAlb(x,y),k=0.94*(1-0.62*sm(0,0.9,GEO.cast[y*TW+x]));return [a[0]*k,a[1]*k,a[2]*k];};
 thighTex=shadeTex({h:GEO.thh,mask:GEO.thm,tiny:GEO.thTiny,S:200*BK/1.5,wrap:0.55,spec:0.2,shin:24,rim:0.22,sss:0.3,albedo:thAlb});
}
function bakeShirt(){
 const base=[1,0.37,0.64],cream=[0.95,0.9,0.77];
 shirtTex=shadeTex({h:GEO.sh,mask:GEO.shm,tiny:GEO.shTiny,S:150*BK/1.5,wrap:0.5,spec:0.07,shin:14,rim:0.22,sss:0.08,
  albedo:(x,y)=>{const t=GEO.textM[y*TW+x],n=1+hnoise(x,y)*0.035;return [(base[0]+(cream[0]-base[0])*t)*n,(base[1]+(cream[1]-base[1])*t)*n,(base[2]+(cream[2]-base[2])*t)*n];}});
}
async function initArt(){try{await Promise.race([document.fonts.load("72px 'Bowlby One'"),new Promise(r=>setTimeout(r,1500))]);}catch(e){}
 bakeGeometry();bakeSkin();bakeShirt();artReady=true;}
initArt();
const reSkin=()=>{if(GEO)bakeSkin();};
const halves=[-1,1].map(s=>({s,ox:0,vx:0,oy:0,vy:0,sq:0,vsq:0}));
const parts=[],rings=[],stinks=[],flies=[];
const S={open:0,openAvg:0,rms:0,shX:0,shY:0,spawn:0,ringT:0,stinkT:0};
function buttKick(){halves.forEach(h=>{h.vy+=(Math.random()-0.3)*160;h.vx+=h.s*(60+Math.random()*60);h.vsq+=0.6;});}
bc.addEventListener('pointerdown',e=>{bc.setPointerCapture(e.pointerId);buttPress();e.preventDefault();});
bc.addEventListener('pointerup',buttRelease);bc.addEventListener('pointercancel',buttRelease);

function drawBG(t,open){
 let g=ctx.createLinearGradient(0,0,0,LH);g.addColorStop(0,'#2a1a3c');g.addColorStop(1,'#110a1a');ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);
 ctx.save();ctx.translate(CX,300);ctx.rotate(t*0.035);
 const N=22,al=0.05+S.rms*0.5+open*0.05;
 for(let k=0;k<N;k++){const a0=k*6.2832/N;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,760,a0,a0+3.1416/N);ctx.closePath();ctx.fillStyle='rgba(255,110,190,'+al+')';ctx.fill();}
 ctx.restore();
 g=ctx.createRadialGradient(CX,60,0,CX,60,560);g.addColorStop(0,'rgba(255,236,190,.20)');g.addColorStop(1,'rgba(255,236,190,0)');ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);
 g=ctx.createRadialGradient(CX,420,0,CX,420,340);g.addColorStop(0,'rgba(182,255,60,'+(0.03+open*0.2)+')');g.addColorStop(1,'rgba(182,255,60,0)');ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);
 g=ctx.createRadialGradient(CX,320,200,CX,320,470);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);
}
function drawHalfTex(h,open){
 const s=h.s,pv=CX+s*110,ox=h.ox+s*open*5,c=ox/320,a=1+h.sq,d=1+h.sq*0.6;
 ctx.save();ctx.transform(a,0,c,d,pv-pv*a-c*120,250-250*d+h.oy);
 ctx.beginPath();ctx.rect(s<0?-100:CX,-100,s<0?CX+100:LW-CX+100,LH+200);ctx.clip();
 ctx.drawImage(torsoTex,0,-PADT,LW,LH+PADT+PADB);ctx.restore();
}
function drawCrack(open,flap){
 const dk=(m,al)=>'rgba('+(skin[0]*m|0)+','+(skin[1]*m*0.93|0)+','+(skin[2]*m*0.9|0)+','+al+')';
 // soft extra shade that deepens as pressure spreads the cheeks (gradient only, no shape)
 ctx.save();ctx.translate(CX,sphY-20);ctx.scale((16+open*22)/110,1);
 let g=ctx.createRadialGradient(0,0,0,0,0,125);g.addColorStop(0,dk(0.3,0.15+open*0.45));g.addColorStop(1,dk(0.5,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,125,0,6.2832);ctx.fill();ctx.restore();
 // butthole: pink, soft edges, pucker lines, no outline
 const rx=10+open*4,ry=13+open*5,hole=Math.max(0,(open*0.5+flap*0.5)*8);
 ctx.save();ctx.translate(CX,sphY+1);ctx.scale(rx/ry,1);
 g=ctx.createRadialGradient(0,0,1,0,0,ry*1.35);g.addColorStop(0,'rgba(190,84,110,1)');g.addColorStop(0.5,'rgba(206,108,132,.85)');g.addColorStop(1,'rgba(214,126,146,0)');
 ctx.beginPath();ctx.arc(0,0,ry*1.35,0,6.2832);ctx.fillStyle=g;ctx.fill();
 for(let k=0;k<14;k++){const an=k/14*6.2832,c=Math.cos(an),sn=Math.sin(an),x0=c*(hole+1.5),y0=sn*(hole+1.5)*1.1,x1=c*ry*0.85,y1=sn*ry*0.9;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.strokeStyle='rgba(120,36,66,.55)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(x0+1.1,y0+1);ctx.lineTo(x1+1.1,y1+1);ctx.strokeStyle='rgba(255,200,215,.16)';ctx.lineWidth=1;ctx.stroke();}
 if(hole>0.4){g=ctx.createRadialGradient(0,0,0,0,0,hole*1.3);g.addColorStop(0,'rgba(58,10,26,1)');g.addColorStop(0.7,'rgba(96,24,48,.95)');g.addColorStop(1,'rgba(150,50,80,0)');ctx.beginPath();ctx.ellipse(0,0,hole*1.1,hole*1.3,0,0,6.2832);ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle='rgba(182,255,60,'+Math.min(0.5,open*0.5)+')';ctx.beginPath();ctx.ellipse(0,0,hole*0.45,hole*0.5,0,0,6.2832);ctx.fill();}
 ctx.restore();
}
function drawSphincter(open,flap,buf){
 if(!(buf&&open>0.04))return;
 const r=10+open*6;ctx.save();ctx.translate(CX,sphY);const N=96;ctx.beginPath();
 for(let i=0;i<=N;i++){const a=i/N*6.2832,w=buf[(i%N)*4%buf.length],rad=r+16+w*30,px=Math.cos(a)*rad,py=Math.sin(a)*rad*1.15;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
 ctx.closePath();ctx.shadowColor='#b6ff3c';ctx.shadowBlur=12;ctx.strokeStyle='rgba(182,255,60,'+Math.min(0.8,open*1.1)+')';ctx.lineWidth=2;ctx.stroke();ctx.shadowBlur=0;ctx.restore();
}
function drawButt(t,dt,buf){
 const e=voice?voice.env:0,target=Math.min(1,e*P.pressure*1.15);
 S.open+=(target-S.open)*Math.min(1,dt*18);S.openAvg+=(S.open-S.openAvg)*Math.min(1,dt*0.5);
 const open=S.open;let rms=0;if(buf){let a=0;for(let i=0;i<buf.length;i++)a+=buf[i]*buf[i];rms=Math.sqrt(a/buf.length);}
 S.rms+=(rms-S.rms)*Math.min(1,dt*20);
 const shake=Math.min(1,open*1.2),flap=voice?Math.min(1,voice.flap*5):0;
 halves.forEach(h=>{
  const rum=Math.sin(t*6.2832*(3.5+h.s*0.4))*P.rumble*shake*6;
  const tx=(Math.random()-0.5)*shake*14*(0.4+P.flutter)+rum*h.s,ty=(Math.random()-0.5)*shake*12-shake*3+rum*0.4,tq=shake*(0.02+flap*0.03)*(0.5+Math.random()*0.5),k=420,c=17;
  h.vx+=(k*(tx-h.ox)-c*h.vx)*dt;h.ox+=h.vx*dt;h.vy+=(k*(ty-h.oy)-c*h.vy)*dt;h.oy+=h.vy*dt;h.vsq+=(k*0.5*(tq-h.sq)-c*0.6*h.vsq)*dt;h.sq+=h.vsq*dt;
  h.ox=Math.max(-26,Math.min(26,h.ox));h.oy=Math.max(-26,Math.min(26,h.oy));h.sq=Math.max(-0.1,Math.min(0.12,h.sq));});
 ctx.setTransform(dpr,0,0,dpr,0,0);

 drawBG(t,open);
 ctx.save();ctx.translate(CX,ZANCH);ctx.scale(ZOOM,ZOOM);ctx.translate(-CX,-ZPIV);
 for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=dt*300;r.a-=dt*1.1;if(r.a<=0){rings.splice(i,1);continue;}
  ctx.beginPath();ctx.arc(CX,sphY,r.r,0,6.2832);ctx.strokeStyle='rgba(182,255,60,'+r.a*0.5+')';ctx.lineWidth=3+r.a*4;ctx.stroke();}
 if(!artReady){ctx.restore();ctx.fillStyle='#b6ff3c';ctx.font='20px monospace';ctx.textAlign='center';ctx.fillText('warming up…',CX,LH/2);return;}
 S.shX=(Math.random()-0.5)*shake*4;S.shY=(Math.random()-0.5)*shake*4;
 ctx.save();ctx.translate(S.shX,S.shY);
 ctx.drawImage(torsoTex,0,-PADT,LW,LH+PADT+PADB);
 halves.forEach(h=>drawHalfTex(h,open));
 drawCrack(open,flap);
 drawSphincter(open,flap,buf);
 ctx.globalCompositeOperation='lighter';
 const gl=ctx.createRadialGradient(CX,sphY+14,0,CX,sphY+14,150);gl.addColorStop(0,'rgba(150,255,60,'+(open*0.2)+')');gl.addColorStop(1,'rgba(150,255,60,0)');ctx.fillStyle=gl;ctx.fillRect(CX-160,sphY-140,320,300);
 ctx.globalCompositeOperation='source-over';
 ctx.restore();
 // spawn
 if(open>0.02){
  S.spawn+=dt*open*(30+P.gas*110);
  while(S.spawn>=1&&parts.length<420){S.spawn-=1;
   const ang=Math.PI/2+(Math.random()-0.5)*1.9,sp=60+open*230*(Math.random()+0.3),dark=Math.random()<P.wet*0.35;
   parts.push({x:CX+(Math.random()-0.5)*10,y:sphY+6,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:7+Math.random()*9,g:26+Math.random()*30,life:0,max:0.7+Math.random()*0.9,h:dark?38:68+Math.random()*34,l:dark?30:46,type:0});}
  const wd=voice?1-voice.wetGate:0;
  if(Math.random()<P.wet*open*wd*0.9){for(let k=0;k<3;k++)parts.push({x:CX,y:sphY+4,vx:(Math.random()-0.5)*520,vy:80+Math.random()*300,r:2+Math.random()*3,g:0,life:0,max:0.6,h:25,l:30,type:1});}
  S.ringT-=dt;if(S.ringT<=0&&open>0.12){S.ringT=0.12;rings.push({r:30,a:0.9});}
  S.stinkT-=dt;if(S.stinkT<=0&&P.gas*open>0.03){S.stinkT=0.5-P.gas*0.4;if(stinks.length<14)stinks.push({x:CX+(Math.random()-0.5)*460,y:320+Math.random()*190,life:0,max:1.6+Math.random(),ph:Math.random()*6});}
 }
 if(P.gas>0.3&&S.openAvg>0.12&&flies.length<Math.round(P.gas*6)&&Math.random()<dt*1.2)flies.push({a:Math.random()*6.28,sp:(1.5+Math.random()*2.5)*(Math.random()<.5?-1:1),rx:70+Math.random()*120,ry:50+Math.random()*90,ph:Math.random()*6,life:0,max:4+Math.random()*5});
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type===0){p.vx*=1-1.8*dt;p.vy*=1-1.3*dt;p.vy-=34*dt;p.r+=p.g*dt;}else p.vy+=700*dt;
  const k=1-p.life/p.max;
  if(p.type===0){const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);gr.addColorStop(0,'hsla('+p.h+',70%,'+(p.l+8)+'%,'+(k*0.6)+')');gr.addColorStop(0.6,'hsla('+p.h+',65%,'+p.l+'%,'+(k*0.3)+')');gr.addColorStop(1,'hsla('+p.h+',60%,'+p.l+'%,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fill();}
  else{ctx.fillStyle='hsla('+p.h+',60%,'+p.l+'%,'+k+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fill();}}
 for(let i=stinks.length-1;i>=0;i--){const s=stinks[i];s.life+=dt;if(s.life>=s.max){stinks.splice(i,1);continue;}
  const k=Math.sin(s.life/s.max*Math.PI);ctx.beginPath();
  for(let j=0;j<=18;j++){const px=s.x+Math.sin(j*0.7+t*5+s.ph)*9,py=s.y-j*8-s.life*70;j?ctx.lineTo(px,py):ctx.moveTo(px,py);}
  ctx.strokeStyle='hsla(85,70%,52%,'+k*0.7+')';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();}
 for(let i=flies.length-1;i>=0;i--){const f=flies[i];f.life+=dt;if(f.life>=f.max){flies.splice(i,1);continue;}
  f.a+=f.sp*dt;const al=Math.sin(f.life/f.max*Math.PI),x=CX+Math.cos(f.a)*f.rx+Math.sin(t*7+f.ph)*5,y=345+Math.sin(f.a*1.7+f.ph)*f.ry+Math.cos(t*9+f.ph)*5,wf=Math.sin(t*70+f.ph)*0.5+0.5;
  ctx.fillStyle='rgba(255,255,255,'+0.5*al+')';ctx.beginPath();ctx.ellipse(x-3.5,y-3.5,4,1.6+wf*1.4,-0.6,0,6.2832);ctx.fill();ctx.beginPath();ctx.ellipse(x+3.5,y-3.5,4,1.6+wf*1.4,0.6,0,6.2832);ctx.fill();
  ctx.fillStyle='rgba(8,4,6,'+al+')';ctx.beginPath();ctx.arc(x,y,3.4,0,6.2832);ctx.fill();}
 ctx.restore();
 bc.style.boxShadow='0 0 '+(open*50|0)+'px rgba(182,255,60,'+(open*0.45)+')';
}
function drawScope(buf){
 const W=sc.width,H=sc.height;sctx.setTransform(1,0,0,1,0,0);sctx.fillStyle='#150e1d';sctx.fillRect(0,0,W,H);
 sctx.strokeStyle='rgba(143,127,163,.25)';sctx.lineWidth=1;sctx.beginPath();sctx.moveTo(0,H/2);sctx.lineTo(W,H/2);sctx.stroke();
 if(!buf)return;sctx.beginPath();
 for(let i=0;i<buf.length;i++){const x=i/(buf.length-1)*W,y=H/2-buf[i]*H*0.9;i?sctx.lineTo(x,y):sctx.moveTo(x,y);}
 sctx.shadowColor='#b6ff3c';sctx.shadowBlur=8*dpr;sctx.strokeStyle='#b6ff3c';sctx.lineWidth=2*dpr;sctx.stroke();sctx.shadowBlur=0;
}
const psiBar=document.querySelector('#psi div');
let last=performance.now();
function frame(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 let buf=null;if(analyser){analyser.getFloatTimeDomainData(aBuf);buf=aBuf;}
 drawButt(now/1000,dt,buf);drawScope(buf);
 psiBar.style.height=(voice?Math.min(1,voice.env*P.pressure)*100:0)+'%';
 requestAnimationFrame(frame);
}
DEFS.forEach(d=>setParam(d[1],d[5]));
requestAnimationFrame(frame);
